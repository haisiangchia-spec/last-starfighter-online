name: Combat regression tests
on:
  push:
    branches: [main]
    paths:
      - 'online-battle.js'
      - 'tests/**'
      - '.github/workflows/combat-tests.yml'
  pull_request:
    paths:
      - 'online-battle.js'
      - 'tests/**'
      - '.github/workflows/combat-tests.yml'
  workflow_dispatch:
jobs:
  combat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run production combat regression suite
        run: node --test tests/combat.test.cjs
