name: Browser fidelity and multiplayer E2E
on:
  push:
    branches: [main]
    paths:
      - 'game.html'
      - 'index.html'
      - 'lobby.js'
      - 'online-battle.html'
      - 'online-battle.js'
      - 'firestore.rules'
      - 'firebase.json'
      - 'package.json'
      - 'playwright.config.cjs'
      - 'tests/browser/**'
      - '.github/workflows/browser-e2e.yml'
  pull_request:
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Run local and isolated four-browser multiplayer checks
        run: npx firebase emulators:exec --project demo-starfighter --only auth,firestore "npm run test:browser"
      - name: Upload browser traces and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
