name: Browser and combat fidelity
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  combat:
    name: Combat regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run test:combat

  browser:
    name: Chromium + Firestore emulator fidelity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Run emulator-backed browser tests
        run: npx firebase emulators:exec --project demo-starfighter --only auth,firestore "npm run test:browser"
        env:
          CI: 'true'
      - name: Attach Playwright failure report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
